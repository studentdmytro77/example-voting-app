name: PR Validation Gate (CI)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  # =====================================================================
  # 1. ЛІНТЕР ТА СТАТИЧНИЙ АНАЛІЗ КОДУ (SAST)
  # =====================================================================
  lint-and-sast:
    name: Linters & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfiles with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./vote/Dockerfile
          failure-threshold: error

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Flake8 (Linter) & Bandit (Python Static Security Analysis)
        run: |
          pip install flake8 bandit
          # Перевірка критичних синтаксичних помилок Python
          flake8 ./vote --count --select=E9,F63,F7,F82 --show-source --statistics
          # Статичний аналіз безпеки коду (SAST)
          bandit -r ./vote -ll

  # =====================================================================
  # 2. ЗАЛЕЖНОСТІ, ЗБІРКА АРТЕФАКТІВ ТА ЮНІТ-ТЕСТИ
  # =====================================================================
  unit-tests-and-build:
    name: Dependencies, Unit Tests & Artifact Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Тестування сервісу Vote (Python) ---
      - name: Set up Python & Cache Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './vote/requirements.txt'

      - name: Install Vote dependencies & Run Pytest
        working-directory: ./vote
        run: |
          pip install -r requirements.txt pytest
          pytest test_app.py -v

      # --- Перевірка залежностей та коду Result (Node.js) ---
      - name: Set up Node.js & Cache Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './result/package.json'

      - name: Install Result dependencies & Validate syntax
        working-directory: ./result
        run: |
          npm install
          node --check server.js
          node --check ./tests/tests.js

      # --- Отримання залежностей та білд артефакту Worker (.NET) ---
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies & Publish Worker Artifact
        working-directory: ./worker
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet publish -c Release -o ./out

      - name: Upload Compiled Worker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-release-binaries
          path: ./worker/out/
          retention-days: 3

  # =====================================================================
  # 3. ТЕСТОВИЙ БІЛД DOCKER-ОБРАЗІВ (БЕЗ PUSH) ТА СКАНЕР БЕЗПЕКИ TRIVY
  # =====================================================================
  docker-build-and-security-scan:
    name: Docker Build (Dry-Run) & Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-sast, unit-tests-and-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Images Locally (No Push to ACR)
        run: |
          docker build -t local/voting-app-vote:pr-${{ github.event.number }} ./vote
          docker build -t local/voting-app-result:pr-${{ github.event.number }} ./result
          docker build -t local/voting-app-worker:pr-${{ github.event.number }} ./worker

      - name: Run Trivy Vulnerability Scanner on Repo Dependencies (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Жорстке блокування пайплайну при знаходженні вразливостей

      - name: Run Trivy Container Image Scanner on Vote Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/voting-app-vote:pr-${{ github.event.number }}'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Жорстке блокування пайплайну при знаходженні вразливостей
